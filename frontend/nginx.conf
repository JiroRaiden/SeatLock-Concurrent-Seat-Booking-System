server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Security headers.
    #
    # `always` is important on every one of these: without it nginx only adds
    # the header to 2xx/3xx responses, so a 404 or a 500 would be served
    # WITHOUT protection — and an error page is exactly where injected content
    # tends to end up.
    # ------------------------------------------------------------------

    # Stops the browser from second-guessing our Content-Type. Without it, a
    # file we serve as text/plain that happens to start with "<html>" can be
    # sniffed and executed as HTML — the classic route to XSS via an upload.
    add_header X-Content-Type-Options "nosniff" always;

    # Forbids the site being framed at all, which kills clickjacking: an
    # attacker cannot load SeatLock in a transparent iframe over their own page
    # and trick a user into clicking "Pay". DENY rather than SAMEORIGIN because
    # nothing in this app ever needs to frame itself.
    add_header X-Frame-Options "DENY" always;

    # Controls what we leak in the Referer header. Cross-origin requests get
    # only the origin (https://seatlock.example), never the path — so a booking
    # URL containing a hold id is never handed to a third-party host. Same-origin
    # navigation keeps the full path, which analytics and debugging need.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Turns off browser features this app has no use for. A defence in depth:
    # if script ever were injected, it still could not reach the camera or the
    # user's location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ------------------------------------------------------------------
    # Content-Security-Policy — the real one, not a placeholder.
    #
    # default-src 'self'        everything not named below must come from us.
    # script-src  'self'        NO 'unsafe-inline' and NO 'unsafe-eval'. Vite
    #                           emits real .js files, so we do not need either,
    #                           and their absence is what makes this CSP an
    #                           actual XSS mitigation rather than decoration —
    #                           an injected <script> tag simply will not run.
    # style-src   'self' 'unsafe-inline' + fonts.googleapis.com
    #                           'unsafe-inline' is required here and is the one
    #                           concession: React sets inline `style` attributes
    #                           (the seat curve transform, the poster palette),
    #                           and CSP treats those as inline styles. Inline
    #                           style is a far weaker vector than inline script —
    #                           it cannot execute code — so this is an acceptable
    #                           trade. The Google Fonts origin is needed because
    #                           index.html loads a stylesheet from it.
    # font-src    'self' fonts.gstatic.com
    #                           googleapis serves the CSS; gstatic serves the
    #                           actual .woff2 files. Both are required, and they
    #                           are genuinely different hosts.
    # img-src     'self' data:  data: covers inline SVG artwork; no external
    #                           image host is allowed, because this app has no
    #                           external images by design.
    # connect-src 'self'        XHR/fetch may only reach our own origin. In this
    #                           deployment nginx proxies /api to Spring, so the
    #                           API is same-origin. If the API is moved to its
    #                           own hostname, add it here explicitly.
    # frame-ancestors 'none'    the modern equivalent of X-Frame-Options: DENY.
    #                           Both are set because older browsers only honour
    #                           the header above.
    # base-uri 'self'           stops injected markup rewriting <base href> to
    #                           point every relative URL at an attacker's host.
    # form-action 'self'        a form can only submit back to us, so injected
    #                           markup cannot exfiltrate a POST elsewhere.
    # object-src 'none'         no Flash/Java/embed. Legacy plugin content is a
    #                           pure liability.
    # ------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Do not advertise the exact nginx version in the Server header.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # Cache policy.
    #
    # Vite fingerprints every built asset (app-4f2c9a1b.js), so the filename
    # changes whenever the content does. That makes it safe to cache assets
    # immutably for a year — a new deploy produces new filenames, so there is
    # nothing to invalidate.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # add_header does NOT inherit into a location block that sets its own,
        # so the security headers must be repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html is the opposite case: its NAME never changes but its contents
    # do on every deploy, and it is what points at the fingerprinted assets. If
    # a browser caches it, the user runs last week's app forever.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------------------------------
    # SPA history fallback.
    #
    # React Router owns /events/1/seats, but that path does not exist on disk.
    # A plain nginx would 404 on a hard refresh or a pasted link. This tries the
    # literal file, then a directory, and finally hands back index.html so the
    # router can resolve the route client-side.
    #
    # Note it rewrites to index.html WITHOUT a redirect, so the URL in the
    # address bar is preserved — which is the whole point.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
