<!doctype html>
<html lang="en-IN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080B" />
    <meta
      name="description"
      content="SeatLock — book cinema, concert and comedy seats with a reservation that actually holds."
    />

    <!-- Fonts. preconnect first: the browser can open the TLS connection to the
         font CDN while it is still parsing this document, which removes a
         round-trip from first paint. gstatic is where the .woff2 files live;
         googleapis only serves the CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>SeatLock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
