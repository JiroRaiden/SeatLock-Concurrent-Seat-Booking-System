#       run: |
#         docker build -t "$ECR/seatlock-api:${{ github.sha }}" ./backend
#         docker push "$ECR/seatlock-api:${{ github.sha }}"
#       # Tagged with the commit SHA, never :latest. A mutable tag makes
#       # "which build is running in production?" unanswerable, and makes a
#       # rollback a rebuild rather than a re-point.
#
#     - name: Roll out
#       run: aws ecs update-service --cluster seatlock --service api --force-new-deployment
#       # Flyway runs on startup, so the migration ships with the code. That
#       # only works because every migration in this project is backwards
#       # compatible with the previous release - during a rolling deploy, old
#       # and new instances share one database for a few minutes.
# =============================================================================
